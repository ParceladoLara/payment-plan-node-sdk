name: Publish Package

on:
  release:
    types: [ published ]

permissions:
  id-token: write
  contents: read

jobs:
  publish-node:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org/"
          package-manager-cache: false  # never use caching in release builds

      - name: Run npm ci
        run: npm ci

      - name: Run npm test
        run: npm test
      - name: Publish package
        run: npm publish
