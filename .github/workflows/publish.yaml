name: Publish Package

on:
  release:
    types: [ published ]

permissions:
  id-token: write
  contents: read

jobs:
  publish-node:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org/"

      - name: Publish package
        run: npm publish
